# Included in every location block, not just at the server level.
#
# nginx's add_header only inherits into a location that defines none of its
# own -- a location with even one add_header (the Cache-Control overrides
# below) silently drops every server-level add_header instead of adding to
# them. Repeating these via an include, rather than trusting inheritance,
# was the only way headers actually reached /assets/, /sw.js and /index.html
# rather than only the paths with no Cache-Control override of their own.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.alltechnyeri.co.ke https://*.supabase.co https://firebaseinstallations.googleapis.com https://fcmregistrations.googleapis.com https://fcm.googleapis.com https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), fullscreen=(self)" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
