server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Real client address comes from the proxy in front of this container.
    # Required for the access log to be useful and for fail2ban upstream.
    real_ip_header X-Forwarded-For;

    include /etc/nginx/security-headers.conf;

    # Single page app: any path that is not a real file is the app's own route,
    # so hand back index.html and let the router resolve it. Without this,
    # reloading on /stock or /analytics returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets never change contents under the same name, so they can be
    # cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # The service worker and index must not be cached, or a deploy is invisible
    # until the browser happens to expire them -- which on a POS left open all
    # day can be never.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
